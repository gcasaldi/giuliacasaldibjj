<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
<title id="title">Eternal Aegean — original classical Greek-inspired arena landscape</title>
<desc id="desc">Original atmospheric illustration of an ancient Greek temple above the Aegean sea at sunrise with distant mountains and weathered marble columns, made for a Brazilian Jiu-Jitsu athlete website.</desc>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2=".1" y2="1"><stop stop-color="#0d1828"/><stop offset=".27" stop-color="#37434a"/><stop offset=".55" stop-color="#a97859"/><stop offset=".75" stop-color="#e5af71"/><stop offset="1" stop-color="#273a45"/></linearGradient>
<radialGradient id="light"><stop stop-color="#fff8d6" stop-opacity=".98"/><stop offset=".21" stop-color="#ffdc9b" stop-opacity=".7"/><stop offset=".52" stop-color="#f4b979" stop-opacity=".25"/><stop offset="1" stop-color="#e3a87c" stop-opacity="0"/></radialGradient>
<linearGradient id="sea" x1="0" y1="0" x2=".1" y2="1"><stop stop-color="#a78265"/><stop offset=".36" stop-color="#4e646c"/><stop offset="1" stop-color="#0c2533"/></linearGradient>
<linearGradient id="stone" x1="0" y1="0" x2="1" y2=".75"><stop stop-color="#e9cda3"/><stop offset=".23" stop-color="#a79178"/><stop offset=".58" stop-color="#625f58"/><stop offset="1" stop-color="#272e31"/></linearGradient>
<linearGradient id="pillar" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#504c47"/><stop offset=".15" stop-color="#ead0a4"/><stop offset=".3" stop-color="#bba585"/><stop offset=".53" stop-color="#e7cda2"/><stop offset=".85" stop-color="#78695c"/><stop offset="1" stop-color="#35393a"/></linearGradient>
<linearGradient id="floor" x1="0" y1="0" x2=".1" y2="1"><stop stop-color="#655b51"/><stop offset="1" stop-color="#0b131d"/></linearGradient>
<filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
<filter id="noise"><feTurbulence type="fractalNoise" baseFrequency=".65" numOctaves="3" seed="5" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".13"/></feComponentTransfer></filter>
</defs>
